# qvm-wormhole defaults. Installed to /etc by install-template.sh, so it comes
# from the TemplateVM and is the same in every child.
#
# Each key is overridable per-VM by the matching QVM_WORMHOLE_<KEY> env var,
# which is the supported way to differ without editing the template.

# DispVM template to spawn. Must match the TARGET in the dom0 policy line.
dvm = wormhole_dvm

# Refuse files larger than this (bytes). Default 2 GiB, matching the Qubes
# default private-volume size -- the disposable has to store the file before it
# can send it. Raising this ALSO requires a bigger private volume on the DVM
# template AND raising WORMHOLE_SEND_SIZE_CAP there, which is the real ceiling.
size_cap = 2147483648

# Seconds for the WHOLE transfer, including the wait for a receiver and the
# time the bytes take to move. A large file over a slow link needs more than
# the default; the disposable is destroyed when this expires.
timeout = 3600
